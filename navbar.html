<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateLand Reviews</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        --padding:14px;
    }header{
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: start;
        padding: 10px;
        background: #e1edf1;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .rateland{
        padding: 11px;
        font-size: 20px;
        font-family:'Poppins',sans-serif;
        color: #260e54;
    }
    header nav a{
        padding: 11px;
        margin: 0 15px;
        text-decoration: none;
        color: #825c5c;
        font-size: 17px;
        font-weight: 700;
    }
    nav{
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        
    }
    .navbar a:hover {
        padding: 11px;
        background-color: #ddd;
        color: rgb(86, 68, 68);
    }
    .nav-links{
        display: flex;
        gap: 20px;
        }
    .search-container{
        width: 300px;
        display: flex;
        align-items: center;
        background: #f2f4f6;
        border-radius: 20px;
        padding: 10px 10px 10px;
        margin-right: auto;
    }
    .search-input{
        font-size: 16px;
        font-family: 'Lexend', sans-serif;
        color: #333;
        margin-left: var(--padding);
        outline: none;
        border: none;
        background: transparent;
    }
    
    /*categories dropdown menu*/
    .dropbtn {
      color: #825c5c;
      padding: 11px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      background: none;
      font-weight: 700;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 5px;
      overflow: hidden;
    }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown:hover .dropbtn {
      background-color: #94c096;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      header {
        flex-wrap: wrap;
        align-items: center;
        gap: 15px;
        padding: 15px;
      }

      .rateland {
        font-size: 22px;
        padding: 8px;
      }

      nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
      }

      .search-container {
        width: 100%;
        order: 3;
        margin: 0;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
        order: 2;
      }

      .nav-links a {
        padding: 8px 12px;
        margin: 0 2px;
        font-size: 14px;
        white-space: nowrap;
      }

      .dropdown {
        position: relative;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1000;
        border-radius: 5px;
        overflow: hidden;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }

      .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        font-size: 14px;
      }

      .dropdown-content a:hover {
        background-color: #f1f1f1;
      }}
      .btn {
        display: flex;
        justify-content: center;
        gap: 10px;
        order: 1;
      }
    .btn button{
        width: 100px;
        margin-left: 15px;
        padding: 11px;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        cursor: pointer;
    }
    .btn button:hover{
        color: #000;
    }
    .btn-login{
        background-color: rgb(218, 222, 204);
        color: #6f5e5e;   
    }
    .btn-signup{
        background-color: rgb(218, 222, 204);
        color: #6f5e5e;
    }
    </style>

</head>
<body>
    
    <header>
        <div class="rateland">RateLand</div>
        <nav class="navbar" id="navbar">
            <div class="search-container">
                <span class="search-icon material-symbols-outlined"></span>
                <input type="search" class="search-input" placeholder="search here">
            </div>
            <div class="nav-links">
                <a class="active" href="mainhome.html">HOME</a>
                <a href="myreviews.html">My Reviews</a>
                <a href="writearev.html">Write A Review</a>
                <div class="dropdown">
                    <button onclick="window.location.href='categories.html'" class="dropbtn">Categories</button>
                    <div class="dropdown-content">
                        <a href="#">Clothing</a>
                        <a href="#">Services</a>
                    </div>
                </div>
                <a href="help.html">Help</a>
            </div>
        </nav>
        <div class="btn">
            <button onclick="window.location.href='login.html'" class="btn-login">Log in</button>
            <button onclick="window.location.href='signup.html'" class="btn-signup">Sign up</button>
        </div>
    </header>
</body>
</html>
