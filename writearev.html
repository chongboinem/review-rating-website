<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Write a Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* navbar */
           * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        --padding:14px;
    }header{
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: start;
        padding: 10px;
        background: #e1edf1;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .rateland{
        padding: 11px;
        font-size: 20px;
        font-family:'Poppins',sans-serif;
        color: #260e54;
    }
    header nav a{
        padding: 11px;
        margin: 0 15px;
        text-decoration: none;
        color: #825c5c;
        font-size: 17px;
        font-weight: 700;
    }
    nav{
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        
    }
    .navbar a:hover {
        padding: 11px;
        background-color: #ddd;
        color: rgb(86, 68, 68);
    }
    .nav-links{
        display: flex;
        gap: 20px;
        }
    .search-container{
        width: 300px;
        display: flex;
        align-items: center;
        background: #f2f4f6;
        border-radius: 20px;
        padding: 10px 10px 10px;
        margin-right: auto;
    }
    .search-input{
        font-size: 16px;
        font-family: 'Lexend', sans-serif;
        color: #333;
        margin-left: var(--padding);
        outline: none;
        border: none;
        background: transparent;
    }
    
    /*categories dropdown menu*/
    .dropbtn {
      color: #825c5c;
      padding: 11px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      background: none;
      font-weight: 700;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 5px;
      overflow: hidden;
    }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown:hover .dropbtn {
      background-color: #94c096;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      header {
        flex-wrap: wrap;
        align-items: center;
        gap: 15px;
        padding: 15px;
      }

      .rateland {
        font-size: 22px;
        padding: 8px;
      }

      nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
      }

      .search-container {
        width: 100%;
        order: 3;
        margin: 0;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
        order: 2;
      }

      .nav-links a {
        padding: 8px 12px;
        margin: 0 2px;
        font-size: 14px;
        white-space: nowrap;
      }

      .dropdown {
        position: relative;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1000;
        border-radius: 5px;
        overflow: hidden;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }

      .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        font-size: 14px;
      }

      .dropdown-content a:hover {
        background-color: #f1f1f1;
      }}
      .btn {
        display: flex;
        justify-content: center;
        gap: 10px;
        order: 1;
      }
    .btn button{
        width: 100px;
        margin-left: 15px;
        padding: 11px;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        cursor: pointer;
    }
    .btn button:hover{
        color: #000;
    }
    .btn-login{
        background-color: rgb(218, 222, 204);
        color: #6f5e5e;   
    }
    .btn-signup{
        background-color: rgb(218, 222, 204);
        color: #6f5e5e;
    }
    /* nav bar ends */

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f4f4fa;
      padding: 20px;
    }

    .review-form {
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      margin-top: 30px;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 15px;
    }

    .stars {
      display: flex;
      font-size: 26px;
      gap: 10px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .stars span {
      color: #ccc;
      transition: color 0.2s;
    }

    .stars span.selected {
      color: #ffc107;
    }

    .upload-box {
      border: 2px dashed #c7c7ff;
      padding: 30px;
      text-align: center;
      background: #f0f1ff;
      border-radius: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      position: relative;
    }

    .upload-box input {
      display: none;
    }

    .upload-preview {
      margin-top: 15px;
      max-height: 200px;
      object-fit: contain;
      border-radius: 12px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .buttons button {
      flex: 1;
      padding: 14px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-cancel {
      background: #eee;
      color: #333;
    }

    .btn-submit {
      background: #708d76;
      color: white;
    }

    .btn-submit:hover{
        background-color: #a3b5a7;
    }
    .suggestions {
      position: relative;
      background: white;
      border: 1px solid #ccc;
      max-height: 160px;
      overflow-y: auto;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .suggestion-item:hover {
      background-color: #f0f0f0;
    }

    .suggestion-item img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 4px;
    }
  </style>
</head>
<body>
    
    <header>
        <div class="rateland">RateLand</div>
        <nav class="navbar" id="navbar">
            <div class="search-container">
                <span class="search-icon material-symbols-outlined"></span>
                <input type="search" class="search-input" placeholder="search here">
            </div>
            <div class="nav-links">
                <a class="active" href="mainhome.html">HOME</a>
                <a href="myreviews.html">My Reviews</a>
                <a href="writearev.html">Write A Review</a>
                <div class="dropdown">
                    <button onclick="window.location.href='categories.html'" class="dropbtn">Categories</button>
                    <div class="dropdown-content">
                        <a href="categories.html">Clothing</a>
                        <a href="categories.html">Services</a>
                    </div>
                </div>
                <a href="help.html">Help</a>
            </div>
        </nav>
        <div class="btn">
            <button onclick="window.location.href='login.html'" class="btn-login">Log in</button>
            <button onclick="window.location.href='signup.html'" class="btn-signup">Sign up</button>
        </div>
    </header>
  <form class="review-form" id="reviewForm">
    <label for="brand">Business Name</label>
    <input type="text" id="brand" placeholder="Enter business name..." autocomplete="off" required>
    <div id="brandSuggestions" class="suggestions"></div>

    <label for="title">Review Title</label>
    <input type="text" id="title" placeholder="Sum up your experience..." required>

    <label>Rating</label>
    <div class="stars" id="starRating">
      <span data-value="1">&#9733;</span>
      <span data-value="2">&#9733;</span>
      <span data-value="3">&#9733;</span>
      <span data-value="4">&#9733;</span>
      <span data-value="5">&#9733;</span>
    </div>

    <label for="message">Your Review</label>
    <textarea id="message" placeholder="Share your detailed experience..." required></textarea>

    <div class="upload-box" onclick="document.getElementById('fileUpload').click()">
      <img src="https://img.icons8.com/ios/50/000000/add-image.png" alt="Upload" />
      <h4>Upload Photos & Videos</h4>
      <p>Click to add visual content to your review</p>
      <input type="file" id="fileUpload" accept="image/*,video/*">
      <img id="previewImage" class="upload-preview" alt="photo" />
    </div>

    <div class="buttons">
      <button type="button" class="btn-cancel" onclick="window.location.href='writearev.html'">Cancel</button>
      <button type="submit" class="btn-submit"> Submit Review</button>
    </div>
  </form>

  <script>
    // Star rating
    const stars = document.querySelectorAll('#starRating span');
    let selectedRating = 0;

    stars.forEach(star => {
      star.addEventListener('mouseover', () => highlight(star.dataset.value));
      star.addEventListener('mouseout', () => highlight(selectedRating));
      star.addEventListener('click', () => {
        selectedRating = star.dataset.value;
        highlight(selectedRating);
      });
    });

    function highlight(rating) {
      stars.forEach(star => {
        star.classList.toggle('selected', parseInt(star.dataset.value) <= parseInt(rating));
      });
    }

    // Brand autocomplete
    const brandInput = document.getElementById("brand");
    const brandBox = document.getElementById("brandSuggestions");

    const brands = [
      {name: "Amazon",logo: "https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"},
      {name: "Flipkart",logo: "https://www.citypng.com/public/uploads/preview/hd-flipkart-round-logo-icon-transparent-png-701751694966204grvmunpzzf.png?v=2025052420"},
      { name: "Urban Company", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4ZmvSjX4ansWxN7eS9c2QG3QIWLxEYWk4eBItEKU-13fI30-zTKqa0GvKczYQfF9bPfM&usqp=CAU" },
      { name: "Swarovski", logo: "https://logosandtypes.com/wp-content/uploads/2024/04/Swarovski.png" },
      { name: "Lenovo", logo: "https://1000logos.net/wp-content/uploads/2017/03/Lenovo-Logo.png" },
      { name: "Netflix", logo: "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" },
      { name: "McDonald's", logo: "https://1000logos.net/wp-content/uploads/2017/03/McDonalds-logo.png" },
      { name: "Beauty of Joseon", logo: "https://cdn.shopify.com/s/files/1/0251/2709/6433/files/boj-logo_410x.png" },
      { name: "Innisfree", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Innisfree-logo.svg/2048px-Innisfree-logo.svg.png" },
      { name: "Oishi", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Oishi_Group_Logo.svg/1200px-Oishi_Group_Logo.svg.png" },
      { name: "Spotify", logo: "https://1000logos.net/wp-content/uploads/2017/08/Spotify-symbol.jpg" }
    ];

    brandInput.addEventListener("input", () => {
      const val = brandInput.value.toLowerCase();
      brandBox.innerHTML = "";
      if (!val) return;

      const matched = brands.filter(b => b.name.toLowerCase().includes(val));
      matched.forEach(b => {
        const div = document.createElement("div");
        div.className = "suggestion-item";
        div.innerHTML = `<img src="${b.logo}"><span>${b.name}</span>`;
        div.addEventListener("click", () => {
          brandInput.value = b.name;
          brandInput.dataset.logo = b.logo;
          brandBox.innerHTML = "";
        });
        brandBox.appendChild(div);
      });
    });

    document.addEventListener("click", (e) => {
      if (!brandBox.contains(e.target) && e.target !== brandInput) {
        brandBox.innerHTML = "";
      }
    });

    // Image preview
    document.getElementById("fileUpload").addEventListener("change", function () {
      const preview = document.getElementById("previewImage");
      const file = this.files[0];

      if (file && file.type.startsWith("image")) {
        const reader = new FileReader();
        reader.onload = function () {
          preview.src = reader.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      } else {
        preview.src = "";
        preview.style.display = "none";
      }
    });

    // Submit handler
    document.getElementById("reviewForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const brand = brandInput.value;
      const logo = brandInput.dataset.logo || "";
      const title = document.getElementById("title").value;
      const message = document.getElementById("message").value;
      const fileInput = document.getElementById("fileUpload");
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onloadend = function () {
          saveReview(reader.result);
        };
        reader.readAsDataURL(file);
      } else {
        saveReview("");
      }

      function saveReview(fileData) {
        const review = {
          brand,
          logo,
          title,
          message,
          rating: selectedRating,
          file: fileData,
        };

        const reviews = JSON.parse(localStorage.getItem("myReviews") || "[]");
        reviews.push(review);
        localStorage.setItem("myReviews", JSON.stringify(reviews));

        alert("✅ Your review has been submitted!");
        window.location.href = "myreviews.html";
      }
    });
  </script>

</body>
</html>
